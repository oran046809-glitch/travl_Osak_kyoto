    function App() {
      const [activeTab, setActiveTab] = useState('itinerary');
      const [selectedDay, setSelectedDay] = useState(1);
      const [showImportModal, setShowImportModal] = useState(false);
      const [showAddModal, setShowAddModal] = useState(false);
      const [importText, setImportText] = useState('');

      const [newSpotForm, setNewSpotForm] = useState({
        name: '',
        time: '12:00',
        address: '',
        category: 'spot',
        notes: ''
      });

      const [itinerary, setItinerary] = useState(() => {
        try {
          const saved = localStorage.getItem('kyoto_osaka_html_app');
          return saved ? JSON.parse(saved) : INITIAL_ITINERARY;
        } catch (e) {
          return INITIAL_ITINERARY;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('kyoto_osaka_html_app', JSON.stringify(itinerary));
        } catch (e) {}
      }, [itinerary]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const currentDayData = itinerary.find(d => d.day === selectedDay) || itinerary[0];

      const getGoogleMapsDirectionsUrl = (spotName, address, prevSpot = null) => {
        const destinationQuery = encodeURIComponent(address ? `${spotName} ${address}` : spotName);
        if (prevSpot) {
          const originQuery = encodeURIComponent(prevSpot.address ? `${prevSpot.name} ${prevSpot.address}` : prevSpot.name);
          return `https://www.google.com/maps/dir/?api=1&origin=${originQuery}&destination=${destinationQuery}&travelmode=transit`;
        }
        return `https://www.google.com/maps/dir/?api=1&destination=${destinationQuery}&travelmode=transit`;
      };

      const handleExecuteImport = () => {
        if (!importText.trim()) return;

        const lines = importText.split('\n').filter(line => line.trim() !== '');
        const newSpots = lines.map((line, idx) => {
          const timeMatch = line.match(/^(\d{1,2}:\d{2})\s*(.*)/);
          let time = '12:00';
          let name = line.trim();

          if (timeMatch) {
            time = timeMatch[1];
            name = timeMatch[2] || line.trim();
          }

          return {
            id: `${selectedDay}-imp-${Date.now()}-${idx}`,
            time,
            name,
            address: '',
            notes: '由文字批量匯入',
            category: 'spot',
            googleMapsUrl: `https://maps.google.com/?q=${encodeURIComponent(name)}`
          };
        });

        setItinerary(prev => prev.map(d => {
          if (d.day === selectedDay) {
            return { ...d, spots: [...d.spots, ...newSpots] };
          }
          return d;
        }));

        setImportText('');
        setShowImportModal(false);
      };

      const handleDeleteSpot = (dayNum, spotId) => {
        setItinerary(prev => prev.map(d => {
          if (d.day === dayNum) {
            return { ...d, spots: d.spots.filter(s => s.id !== spotId) };
          }
          return d;
        }));
      };

      const handleCreateSpotSubmit = (e) => {
        e.preventDefault();
        if (!newSpotForm.name.trim()) return;

        const queryTarget = encodeURIComponent(`${newSpotForm.name} ${newSpotForm.address}`.trim());
        const newSpot = {
          id: `${selectedDay}-${Date.now()}`,
          time: newSpotForm.time || '12:00',
          name: newSpotForm.name.trim(),
          address: newSpotForm.address.trim(),

                  activeTab === 'dining' ? 'text-[#8C7A6B] font-bold' : 'text-stone-400'
                }`}
              >
                <i data-lucide="utensils" className="w-5 h-5"></i>
                <span className="text-[10px] mt-1">美食</span>
              </button>
              <button
                onClick={() => setActiveTab('checklist')}
                className={`flex flex-col items-center py-1 px-3 rounded-xl transition-all ${
                  activeTab === 'checklist' ? 'text-[#8C7A6B] font-bold' : 'text-stone-400'
                }`}
              >
                <i data-lucide="check-square" className="w-5 h-5"></i>
                <span className="text-[10px] mt-1">清單</span>
              </button>
              <button
                onClick={() => setActiveTab('tools')}
                className={`flex flex-col items-center py-1 px-3 rounded-xl transition-all ${
                  activeTab === 'tools' ? 'text-[#8C7A6B] font-bold' : 'text-stone-400'
                }`}
              >
                <i data-lucide="wrench" className="w-5 h-5"></i>
                <span className="text-[10px] mt-1">工具</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
