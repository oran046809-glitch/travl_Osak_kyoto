    // 切換分頁
    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-[#8C7A6B]', 'font-bold');
        btn.classList.add('text-stone-400');
      });
      const activeNav = document.getElementById(`nav-${tab}`);
      if (activeNav) {
        activeNav.classList.remove('text-stone-400');
        activeNav.classList.add('text-[#8C7A6B]', 'font-bold');
      }
      renderMain();
    }

    // 切換 DAY

      selectedDay = String(day);
      renderMain();
    }

    // 刪除景點

      const dayData = itinerary.find(d => String(d.day) === String(selectedDay));
      if (dayData) {
        dayData.spots = dayData.spots.filter((s, idx) => (s.id || String(idx)) !== String(spotId));
        renderMain();
      }
    }

    // 導航 URL
    function getDirectionsUrl(spot, prevSpot) {
      const dest = encodeURIComponent(spot.address ? `${spot.name} ${spot.address}` : spot.name);
      if (prevSpot) {
        const orig = encodeURIComponent(prevSpot.address ? `${prevSpot.name} ${prevSpot.address}` : prevSpot.name);
        return `https://www.google.com/maps/dir/?api=1&origin=${orig}&destination=${dest}&travelmode=transit`;
      }
      return `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=transit`;
    }
